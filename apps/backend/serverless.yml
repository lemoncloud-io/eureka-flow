service: eureka-flows-backend

provider:
    name: aws
    runtime: nodejs20.x
    region: ap-northeast-2
    stage: ${opt:stage, 'local'}
    environment:
        STAGE: ${self:provider.stage}
        DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
        FLOWS_TABLE: ${self:service}-flows-${self:provider.stage}
        CONNECTIONS_TABLE: ${self:service}-connections-${self:provider.stage}
        ORCHESTRATOR_MODE: ${env:ORCHESTRATOR_MODE, 'mock'}
        ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY, ''}
    httpApi:
        cors: true

plugins:
    - serverless-esbuild
    - serverless-offline

custom:
    esbuild:
        bundle: true
        minify: false
        sourcemap: true
        target: node22
        platform: node
        external:
            - '@aws-sdk/*'
        define:
            'require.resolve': 'undefined'
    serverless-offline:
        httpPort: 8800
        websocketPort: 8801
        noPrependStageInUrl: true

functions:
    # ── Health ──
    health:
        handler: src/handlers/http/health.main
        events:
            - httpApi:
                  path: /
                  method: get
            - httpApi:
                  path: /_apis
                  method: get
            - httpApi:
                  path: /_api_
                  method: get

    # ── Flows ──
    flowLoad:
        handler: src/handlers/http/flows/load-flow.main
        events:
            - httpApi:
                  path: '/flows/{id}/load'
                  method: get
            - httpApi:
                  path: '/_apis/flows/{id}/load'
                  method: get
            - httpApi:
                  path: '/_api_/flows/{id}/load'
                  method: get

    flowSave:
        handler: src/handlers/http/flows/save-flow.main
        events:
            - httpApi:
                  path: '/flows/{id}/save'
                  method: post
            - httpApi:
                  path: '/_apis/flows/{id}/save'
                  method: post
            - httpApi:
                  path: '/_api_/flows/{id}/save'
                  method: post

    flowUpsert:
        handler: src/handlers/http/flows/upsert-flow.main
        events:
            - httpApi:
                  path: '/flows/{id}/upsert'
                  method: post
            - httpApi:
                  path: '/_apis/flows/{id}/upsert'
                  method: post
            - httpApi:
                  path: '/_api_/flows/{id}/upsert'
                  method: post

    flowUpdateMeta:
        handler: src/handlers/http/flows/update-flow-meta.main
        events:
            - httpApi:
                  path: '/flows/{id}'
                  method: post
            - httpApi:
                  path: '/_apis/flows/{id}'
                  method: post
            - httpApi:
                  path: '/_api_/flows/{id}'
                  method: post

    # ── Nodes ──
    nodeList:
        handler: src/handlers/http/nodes/list-nodes.main
        events:
            - httpApi:
                  path: /nodes/0/list
                  method: post
            - httpApi:
                  path: /_apis/nodes/0/list
                  method: post
            - httpApi:
                  path: /_api_/nodes/0/list
                  method: post

    nodeGet:
        handler: src/handlers/http/nodes/get-node.main
        events:
            - httpApi:
                  path: '/nodes/{id}'
                  method: get
            - httpApi:
                  path: '/_apis/nodes/{id}'
                  method: get
            - httpApi:
                  path: '/_api_/nodes/{id}'
                  method: get

    nodeCreate:
        handler: src/handlers/http/nodes/create-node.main
        events:
            - httpApi:
                  path: /nodes/0
                  method: post
            - httpApi:
                  path: /_apis/nodes/0
                  method: post
            - httpApi:
                  path: /_api_/nodes/0
                  method: post

    nodeUpsert:
        handler: src/handlers/http/nodes/upsert-node.main
        events:
            - httpApi:
                  path: '/nodes/{id}/upsert'
                  method: post
            - httpApi:
                  path: '/_apis/nodes/{id}/upsert'
                  method: post
            - httpApi:
                  path: '/_api_/nodes/{id}/upsert'
                  method: post

    nodeDelete:
        handler: src/handlers/http/nodes/delete-node.main
        events:
            - httpApi:
                  path: '/nodes/{id}'
                  method: delete
            - httpApi:
                  path: '/_apis/nodes/{id}'
                  method: delete
            - httpApi:
                  path: '/_api_/nodes/{id}'
                  method: delete

    nodePortGet:
        handler: src/handlers/http/nodes/get-port.main
        events:
            - httpApi:
                  path: '/nodes/{id}/port'
                  method: get
            - httpApi:
                  path: '/_apis/nodes/{id}/port'
                  method: get
            - httpApi:
                  path: '/_api_/nodes/{id}/port'
                  method: get

    nodeRun:
        handler: src/handlers/http/nodes/run-node.main
        events:
            - httpApi:
                  path: '/nodes/{id}/run'
                  method: post
            - httpApi:
                  path: '/_apis/nodes/{id}/run'
                  method: post
            - httpApi:
                  path: '/_api_/nodes/{id}/run'
                  method: post

    # ── Edges ──
    edgeList:
        handler: src/handlers/http/edges/list-edges.main
        events:
            - httpApi:
                  path: /edges/0/list
                  method: post
            - httpApi:
                  path: /_apis/edges/0/list
                  method: post
            - httpApi:
                  path: /_api_/edges/0/list
                  method: post

    edgeCreate:
        handler: src/handlers/http/edges/create-edge.main
        events:
            - httpApi:
                  path: /edges/0
                  method: post
            - httpApi:
                  path: /_apis/edges/0
                  method: post
            - httpApi:
                  path: /_api_/edges/0
                  method: post

    edgeGet:
        handler: src/handlers/http/edges/get-edge.main
        events:
            - httpApi:
                  path: '/edges/{id}'
                  method: get
            - httpApi:
                  path: '/_apis/edges/{id}'
                  method: get
            - httpApi:
                  path: '/_api_/edges/{id}'
                  method: get

    edgeUpdate:
        handler: src/handlers/http/edges/update-edge.main
        events:
            - httpApi:
                  path: '/edges/{id}'
                  method: post
            - httpApi:
                  path: '/_apis/edges/{id}'
                  method: post
            - httpApi:
                  path: '/_api_/edges/{id}'
                  method: post

    edgeDelete:
        handler: src/handlers/http/edges/delete-edge.main
        events:
            - httpApi:
                  path: '/edges/{id}'
                  method: delete
            - httpApi:
                  path: '/_apis/edges/{id}'
                  method: delete
            - httpApi:
                  path: '/_api_/edges/{id}'
                  method: delete

    # ── Blocks ──
    blockList:
        handler: src/handlers/http/blocks/list-blocks.main
        events:
            - httpApi:
                  path: /blocks/0/list
                  method: get
            - httpApi:
                  path: /_apis/blocks/0/list
                  method: get
            - httpApi:
                  path: /_api_/blocks/0/list
                  method: get

    # ── Messages ──
    messageList:
        handler: src/handlers/http/messages/list-messages.main
        events:
            - httpApi:
                  path: '/flows/{flowId}/messages'
                  method: get
            - httpApi:
                  path: '/_apis/flows/{flowId}/messages'
                  method: get
            - httpApi:
                  path: '/_api_/flows/{flowId}/messages'
                  method: get

    messageCreate:
        handler: src/handlers/http/messages/create-message.main
        events:
            - httpApi:
                  path: '/flows/{flowId}/messages'
                  method: post
            - httpApi:
                  path: '/_apis/flows/{flowId}/messages'
                  method: post
            - httpApi:
                  path: '/_api_/flows/{flowId}/messages'
                  method: post

    # ── Proposals ──
    proposalList:
        handler: src/handlers/http/proposals/list-proposals.main
        events:
            - httpApi:
                  path: '/flows/{flowId}/proposals'
                  method: get
            - httpApi:
                  path: '/_apis/flows/{flowId}/proposals'
                  method: get
            - httpApi:
                  path: '/_api_/flows/{flowId}/proposals'
                  method: get

    proposalGet:
        handler: src/handlers/http/proposals/get-proposal.main
        events:
            - httpApi:
                  path: '/proposals/{proposalId}'
                  method: get
            - httpApi:
                  path: '/_apis/proposals/{proposalId}'
                  method: get
            - httpApi:
                  path: '/_api_/proposals/{proposalId}'
                  method: get

    proposalApprove:
        handler: src/handlers/http/proposals/approve-proposal.main
        events:
            - httpApi:
                  path: '/proposals/{proposalId}/approve'
                  method: post
            - httpApi:
                  path: '/_apis/proposals/{proposalId}/approve'
                  method: post
            - httpApi:
                  path: '/_api_/proposals/{proposalId}/approve'
                  method: post

    proposalReject:
        handler: src/handlers/http/proposals/reject-proposal.main
        events:
            - httpApi:
                  path: '/proposals/{proposalId}/reject'
                  method: post
            - httpApi:
                  path: '/_apis/proposals/{proposalId}/reject'
                  method: post
            - httpApi:
                  path: '/_api_/proposals/{proposalId}/reject'
                  method: post

    # ── Runs ──
    runCreate:
        handler: src/handlers/http/runs/start-run.main
        events:
            - httpApi:
                  path: '/flows/{flowId}/runs'
                  method: post
            - httpApi:
                  path: '/_apis/flows/{flowId}/runs'
                  method: post
            - httpApi:
                  path: '/_api_/flows/{flowId}/runs'
                  method: post

    runList:
        handler: src/handlers/http/runs/list-runs.main
        events:
            - httpApi:
                  path: '/flows/{flowId}/runs'
                  method: get
            - httpApi:
                  path: '/_apis/flows/{flowId}/runs'
                  method: get
            - httpApi:
                  path: '/_api_/flows/{flowId}/runs'
                  method: get

    runGet:
        handler: src/handlers/http/runs/get-run.main
        events:
            - httpApi:
                  path: '/runs/{runId}'
                  method: get
            - httpApi:
                  path: '/_apis/runs/{runId}'
                  method: get
            - httpApi:
                  path: '/_api_/runs/{runId}'
                  method: get

    runNodesList:
        handler: src/handlers/http/runs/list-run-nodes.main
        events:
            - httpApi:
                  path: '/runs/{runId}/nodes'
                  method: get
            - httpApi:
                  path: '/_apis/runs/{runId}/nodes'
                  method: get
            - httpApi:
                  path: '/_api_/runs/{runId}/nodes'
                  method: get

    runNodeGet:
        handler: src/handlers/http/runs/get-run-node.main
        events:
            - httpApi:
                  path: '/runs/{runId}/nodes/{nodeId}'
                  method: get
            - httpApi:
                  path: '/_apis/runs/{runId}/nodes/{nodeId}'
                  method: get
            - httpApi:
                  path: '/_api_/runs/{runId}/nodes/{nodeId}'
                  method: get

    runCancel:
        handler: src/handlers/http/runs/cancel-run.main
        events:
            - httpApi:
                  path: '/runs/{runId}/cancel'
                  method: post
            - httpApi:
                  path: '/_apis/runs/{runId}/cancel'
                  method: post
            - httpApi:
                  path: '/_api_/runs/{runId}/cancel'
                  method: post

    runNodeRetry:
        handler: src/handlers/http/runs/retry-node.main
        events:
            - httpApi:
                  path: '/runs/{runId}/nodes/{nodeId}/retry'
                  method: post
            - httpApi:
                  path: '/_apis/runs/{runId}/nodes/{nodeId}/retry'
                  method: post
            - httpApi:
                  path: '/_api_/runs/{runId}/nodes/{nodeId}/retry'
                  method: post

    # ── Traces ──
    traceList:
        handler: src/handlers/http/traces/list-traces.main
        events:
            - httpApi:
                  path: '/runs/{runId}/traces'
                  method: get
            - httpApi:
                  path: '/_apis/runs/{runId}/traces'
                  method: get
            - httpApi:
                  path: '/_api_/runs/{runId}/traces'
                  method: get

    # ── Assets ──
    assetList:
        handler: src/handlers/http/assets/list-assets.main
        events:
            - httpApi:
                  path: '/runs/{runId}/assets'
                  method: get
            - httpApi:
                  path: '/_apis/runs/{runId}/assets'
                  method: get
            - httpApi:
                  path: '/_api_/runs/{runId}/assets'
                  method: get

    assetGet:
        handler: src/handlers/http/assets/get-asset.main
        events:
            - httpApi:
                  path: '/assets/{assetId}'
                  method: get
            - httpApi:
                  path: '/_apis/assets/{assetId}'
                  method: get
            - httpApi:
                  path: '/_api_/assets/{assetId}'
                  method: get

    # ── Workers (future: SQS triggers) ──
    # runWorker:
    #     handler: src/workers/run-worker.main
    #     events:
    #         - sqs:
    #               arn: !GetAtt ExecutionQueue.Arn
    #               batchSize: 1
    #               functionResponseType: ReportBatchItemFailures

    # ── WebSocket ──
    wsConnect:
        handler: src/handlers/ws/connect.main
        events:
            - websocket: $connect
    wsDisconnect:
        handler: src/handlers/ws/disconnect.main
        events:
            - websocket: $disconnect
    wsDefault:
        handler: src/handlers/ws/default.main
        events:
            - websocket: $default

resources:
    Resources:
        FlowsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.FLOWS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: id
                      AttributeType: S
                KeySchema:
                    - AttributeName: id
                      KeyType: HASH

        ConnectionsTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:provider.environment.CONNECTIONS_TABLE}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: connectionId
                      AttributeType: S
                KeySchema:
                    - AttributeName: connectionId
                      KeyType: HASH
                TimeToLiveSpecification:
                    AttributeName: ttl
                    Enabled: true
