name: force-deploy
on:
    workflow_dispatch:
        inputs:
            deploy_web_dev:
                description: 'Deploy Web to DEV'
                required: true
                type: boolean
                default: false
            deploy_web_prod:
                description: 'Deploy Web to PROD'
                required: true
                type: boolean
                default: false

jobs:
    get-versions:
        runs-on: ubuntu-latest
        name: Get Versions
        outputs:
            web-version: ${{ steps.get-web-version.outputs.web-version }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.LEMON_BOT_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Web Version
              if: ${{ github.event.inputs.deploy_web_dev == 'true' || github.event.inputs.deploy_web_prod == 'true' }}
              id: get-web-version
              run: |
                  if [[ -f "apps/web/package.json" ]]; then
                      WEB_VERSION=$(node -p "require('./apps/web/package.json').version")
                      if ! echo "$WEB_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                        echo "Error: Invalid web version format: $WEB_VERSION"
                        exit 1
                      fi
                      echo "web-version=${WEB_VERSION}" >> $GITHUB_OUTPUT
                  fi

    deploy-dev:
        needs: [get-versions]
        if: ${{ github.event.inputs.deploy_web_dev == 'true' }}
        runs-on: ubuntu-latest
        name: Deploy to DEV

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.LEMON_BOT_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              id: cache-dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                      node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
              run: yarn install --frozen-lockfile

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

            - name: Deploy to DEV
              env:
                  BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
                  DEV_CF_DISTRIBUTION_ID: ${{ secrets.DEV_CF_DISTRIBUTION_ID }}
                  VITE_ENV: DEV
                  VITE_PROJECT: FLOWS
                  VITE_API_URL: ${{ secrets.VITE_DEV_API_URL }}
                  VITE_WS_ENDPOINT: ${{ secrets.VITE_DEV_WS_ENDPOINT }}
                  VITE_CODES_URL: ${{ secrets.VITE_DEV_CODES_URL }}
              run: |
                  set -e
                  chmod +x scripts/deploy-web.sh
                  NODE_OPTIONS="--max-old-space-size=4096" yarn web:deploy:dev

    deploy-prod:
        needs: [get-versions]
        if: ${{ github.event.inputs.deploy_web_prod == 'true' }}
        runs-on: ubuntu-latest
        name: Deploy to PROD

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.LEMON_BOT_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              id: cache-dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                      node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
              run: yarn install --frozen-lockfile

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

            - name: Deploy to PROD
              env:
                  BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
                  PROD_CF_DISTRIBUTION_ID: ${{ secrets.PROD_CF_DISTRIBUTION_ID }}
                  VITE_ENV: PROD
                  VITE_PROJECT: FLOWS
                  VITE_API_URL: ${{ secrets.VITE_PROD_API_URL }}
                  VITE_WS_ENDPOINT: ${{ secrets.VITE_PROD_WS_ENDPOINT }}
                  VITE_CODES_URL: ${{ secrets.VITE_PROD_CODES_URL }}
              run: |
                  set -e
                  chmod +x scripts/deploy-web.sh
                  NODE_OPTIONS="--max-old-space-size=4096" yarn web:deploy:prod

    notify-slack:
        needs: [get-versions, deploy-dev, deploy-prod]
        if: ${{ !cancelled() && (needs.deploy-dev.result == 'success' || needs.deploy-prod.result == 'success') }}
        name: Notify Slack
        runs-on: ubuntu-latest

        steps:
            - name: Prepare deployment info
              id: deploy-info
              run: |
                  set -e

                  DEV_WEB="${{ github.event.inputs.deploy_web_dev }}"
                  PROD_WEB="${{ github.event.inputs.deploy_web_prod }}"
                  WEB_VER="${{ needs.get-versions.outputs.web-version }}"

                  TIMESTAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')
                  COMMIT_SHA="${GITHUB_SHA:0:7}"

                  DEV_COUNT=0
                  PROD_COUNT=0

                  [[ "$DEV_WEB" == "true" && "${{ needs.deploy-dev.result }}" == "success" ]] && ((DEV_COUNT++)) || true
                  [[ "$PROD_WEB" == "true" && "${{ needs.deploy-prod.result }}" == "success" ]] && ((PROD_COUNT++)) || true

                  {
                    echo "dev_web=${DEV_WEB}"
                    echo "prod_web=${PROD_WEB}"
                    echo "web_version=${WEB_VER}"
                    echo "timestamp=${TIMESTAMP}"
                    echo "commit_sha=${COMMIT_SHA}"
                    echo "dev_count=${DEV_COUNT}"
                    echo "prod_count=${PROD_COUNT}"
                    echo "dev_success=${{ needs.deploy-dev.result == 'success' }}"
                    echo "prod_success=${{ needs.deploy-prod.result == 'success' }}"
                  } >> $GITHUB_OUTPUT

            - name: Build Slack blocks
              id: slack-blocks
              run: |
                  set -e

                  BLOCKS='[
                      {
                          "type": "header",
                          "text": {
                              "type": "plain_text",
                              "text": ":wrench: Eureka Flows 수동 배포 완료",
                              "emoji": true
                          }
                      },
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": "*배포 완료:* '"${{ steps.deploy-info.outputs.dev_count }}"'개 (개발) + '"${{ steps.deploy-info.outputs.prod_count }}"'개 (운영)"
                          }
                      },
                      {
                          "type": "divider"
                      }'

                  if [[ "${{ steps.deploy-info.outputs.dev_web }}" == "true" && "${{ steps.deploy-info.outputs.dev_success }}" == "true" ]]; then
                      BLOCKS+=',
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": "*개발 환경*\n• *Flows* <https://flow-dev.eureka.codes/|개발 서버> `v'"${{ steps.deploy-info.outputs.web_version }}"'`"
                          }
                      }'
                  fi

                  if [[ "${{ steps.deploy-info.outputs.prod_web }}" == "true" && "${{ steps.deploy-info.outputs.prod_success }}" == "true" ]]; then
                      BLOCKS+=',
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": "*운영 환경*\n• *Flows* <https://flow.eureka.codes/|운영 서버> `v'"${{ steps.deploy-info.outputs.web_version }}"'`"
                          }
                      }'
                  fi

                  BLOCKS+=',
                  {
                      "type": "divider"
                  },
                  {
                      "type": "section",
                      "fields": [
                          {
                              "type": "mrkdwn",
                              "text": "*배포 시각*\n'"${{ steps.deploy-info.outputs.timestamp }}"'"
                          },
                          {
                              "type": "mrkdwn",
                              "text": "*커밋*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`'"${{ steps.deploy-info.outputs.commit_sha }}"'`>"
                          }
                      ]
                  },
                  {
                      "type": "context",
                      "elements": [
                          {
                              "type": "mrkdwn",
                              "text": "수동 실행(Github Workflows) by *${{ github.actor }}* | <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Actions>"
                          }
                      ]
                  }]'

                  echo "$BLOCKS" | jq empty 2>/dev/null || {
                      echo "Error: Invalid JSON blocks"
                      exit 1
                  }

                  {
                      echo "blocks<<EOF"
                      echo "$BLOCKS"
                      echo "EOF"
                  } >> $GITHUB_OUTPUT

            - name: Post to Slack
              continue-on-error: true
              uses: slackapi/slack-github-action@v2.1.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.RELEASE_BOT_TOKEN }}
                  payload: |
                      channel: ${{ secrets.EUREKACODES_CHANNEL }}
                      text: "Eureka Flows 수동 배포 완료"
                      unfurl_links: false
                      unfurl_media: false
                      blocks: ${{ steps.slack-blocks.outputs.blocks }}

    notify-slack-failure:
        needs: [get-versions, deploy-dev, deploy-prod]
        if: ${{ !cancelled() && (needs.deploy-dev.result == 'failure' || needs.deploy-prod.result == 'failure') }}
        name: Notify Slack - Failure
        runs-on: ubuntu-latest

        steps:
            - name: Determine failed deployments
              id: failure-info
              run: |
                  set -e

                  DEV_WEB="${{ github.event.inputs.deploy_web_dev }}"
                  PROD_WEB="${{ github.event.inputs.deploy_web_prod }}"

                  TIMESTAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')
                  COMMIT_SHA="${GITHUB_SHA:0:7}"

                  DEV_FAILED="false"
                  PROD_FAILED="false"

                  [[ "$DEV_WEB" == "true" && "${{ needs.deploy-dev.result }}" == "failure" ]] && DEV_FAILED="true"
                  [[ "$PROD_WEB" == "true" && "${{ needs.deploy-prod.result }}" == "failure" ]] && PROD_FAILED="true"

                  {
                    echo "dev_web=${DEV_WEB}"
                    echo "prod_web=${PROD_WEB}"
                    echo "dev_failed=${DEV_FAILED}"
                    echo "prod_failed=${PROD_FAILED}"
                    echo "timestamp=${TIMESTAMP}"
                    echo "commit_sha=${COMMIT_SHA}"
                  } >> $GITHUB_OUTPUT

            - name: Build failure blocks
              id: failure-blocks
              run: |
                  set -e

                  BLOCKS='[
                      {
                          "type": "header",
                          "text": {
                              "type": "plain_text",
                              "text": ":x: Eureka Flows 수동 배포 실패",
                              "emoji": true
                          }
                      },
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": ":warning: *배포 중 오류가 발생했습니다*"
                          }
                      },
                      {
                          "type": "divider"
                      }'

                  if [[ "${{ steps.failure-info.outputs.dev_failed }}" == "true" ]]; then
                      BLOCKS+=',
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": "*개발 환경 배포 실패*\n• *Flows* <https://flow-dev.eureka.codes/|개발 서버>"
                          }
                      }'
                  fi

                  if [[ "${{ steps.failure-info.outputs.prod_failed }}" == "true" ]]; then
                      BLOCKS+=',
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": "*운영 환경 배포 실패*\n• *Flows* <https://flow.eureka.codes/|운영 서버>"
                          }
                      }'
                  fi

                  BLOCKS+=',
                  {
                      "type": "divider"
                  },
                  {
                      "type": "section",
                      "fields": [
                          {
                              "type": "mrkdwn",
                              "text": "*실패 시각*\n'"${{ steps.failure-info.outputs.timestamp }}"'"
                          },
                          {
                              "type": "mrkdwn",
                              "text": "*커밋*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`'"${{ steps.failure-info.outputs.commit_sha }}"'`>"
                          }
                      ]
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": ":mag: *로그를 확인하여 원인을 파악하세요*"
                      },
                      "accessory": {
                          "type": "button",
                          "text": {
                              "type": "plain_text",
                              "text": "워크플로우 로그 보기",
                              "emoji": true
                          },
                          "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                          "action_id": "view_logs"
                      }
                  },
                  {
                      "type": "context",
                      "elements": [
                          {
                              "type": "mrkdwn",
                              "text": "수동 실행(Github Workflows) by *${{ github.actor }}* | <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Actions>"
                          }
                      ]
                  }]'

                  echo "$BLOCKS" | jq empty 2>/dev/null || {
                      echo "Error: Invalid JSON blocks"
                      exit 1
                  }

                  {
                      echo "blocks<<EOF"
                      echo "$BLOCKS"
                      echo "EOF"
                  } >> $GITHUB_OUTPUT

            - name: Post failure to Slack
              continue-on-error: true
              uses: slackapi/slack-github-action@v2.1.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.RELEASE_BOT_TOKEN }}
                  payload: |
                      channel: ${{ secrets.EUREKACODES_CHANNEL }}
                      text: "Eureka Flows 수동 배포 실패"
                      unfurl_links: false
                      unfurl_media: false
                      blocks: ${{ steps.failure-blocks.outputs.blocks }}
