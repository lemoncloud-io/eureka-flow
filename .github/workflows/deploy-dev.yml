name: deploy-dev
on:
    push:
        branches:
            - develop

jobs:
    changes:
        name: Check changed projects
        runs-on: ubuntu-latest
        outputs:
            web: ${{ steps.set-matrix.outputs.web }}
            admin: ${{ steps.set-matrix.outputs.admin }}
            matrix: ${{ steps.set-matrix.outputs.matrix }}
            has-changes: ${{ steps.set-matrix.outputs.has-changes }}

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: develop

            - uses: dorny/paths-filter@v2
              id: filter
              with:
                  base: 'develop'
                  filters: |
                      web:
                          - 'apps/web/src/**'
                          - 'apps/web/public/**'
                          - 'apps/web/index.html'
                          - 'apps/web/vite.config.mts'
                          - 'apps/web/project.json'
                          - 'apps/web/tsconfig*.json'
                          - 'apps/web/tailwind.config.js'
                          - 'apps/web/postcss.config.cjs'
                          - 'apps/web/.env.*'
                          - 'libs/**'
                          - 'package.json'
                          - 'yarn.lock'
                      admin:
                          - 'apps/admin/src/**'
                          - 'apps/admin/public/**'
                          - 'apps/admin/index.html'
                          - 'apps/admin/vite.config.mts'
                          - 'apps/admin/tsconfig*.json'
                          - 'apps/admin/tailwind.config.cjs'
                          - 'apps/admin/postcss.config.cjs'
                          - 'apps/admin/.env.*'
                          - 'libs/**'
                          - 'package.json'
                          - 'yarn.lock'

            - name: Set matrix for changed projects
              id: set-matrix
              run: |
                  PROJECTS=()
                  WEB_CHANGED="false"
                  ADMIN_CHANGED="false"

                  if [[ "${{ steps.filter.outputs.web }}" == "true" && -d "apps/web" ]]; then
                      PROJECTS+=('"web"')
                      WEB_CHANGED="true"
                  fi

                  if [[ "${{ steps.filter.outputs.admin }}" == "true" && -d "apps/admin" ]]; then
                      PROJECTS+=('"admin"')
                      ADMIN_CHANGED="true"
                  fi

                  if [ ${#PROJECTS[@]} -eq 0 ]; then
                      echo "matrix=[]" >> $GITHUB_OUTPUT
                      echo "has-changes=false" >> $GITHUB_OUTPUT
                  else
                      MATRIX="[$(IFS=,; echo "${PROJECTS[*]}")]"
                      echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
                      echo "has-changes=true" >> $GITHUB_OUTPUT
                  fi

                  echo "web=${WEB_CHANGED}" >> $GITHUB_OUTPUT
                  echo "admin=${ADMIN_CHANGED}" >> $GITHUB_OUTPUT

    version-update:
        needs: changes
        if: ${{ needs.changes.outputs.has-changes == 'true' }}
        name: Update Versions
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            root-version: ${{ steps.version-update.outputs.root-version }}
            web-version: ${{ steps.version-update.outputs.web-version }}
            admin-version: ${{ steps.version-update.outputs.admin-version }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.LEMON_BOT_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Update versions and changelog
              id: version-update
              run: |
                  set -e
                  chmod +x scripts/version-update.js

                  PROJECTS=()
                  [[ "${{ needs.changes.outputs.web }}" == "true" ]] && PROJECTS+=("web")
                  [[ "${{ needs.changes.outputs.admin }}" == "true" ]] && PROJECTS+=("admin")

                  if [ ${#PROJECTS[@]} -eq 0 ]; then
                    echo "No projects to update"
                  else
                    echo "Updating projects: ${PROJECTS[*]}"
                    node scripts/version-update.js "${PROJECTS[@]}"
                  fi

                  # Export updated versions
                  ROOT_VERSION=$(node -p "require('./package.json').version")
                  echo "root-version=${ROOT_VERSION}" >> $GITHUB_OUTPUT

                  if [[ -f "apps/web/package.json" ]]; then
                      WEB_VERSION=$(node -p "require('./apps/web/package.json').version")
                      echo "web-version=${WEB_VERSION}" >> $GITHUB_OUTPUT
                  fi

                  if [[ -f "apps/admin/package.json" ]]; then
                      ADMIN_VERSION=$(node -p "require('./apps/admin/package.json').version")
                      echo "admin-version=${ADMIN_VERSION}" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push changes
              env:
                  ROOT_VERSION: ${{ steps.version-update.outputs.root-version }}
              run: |
                  set -e
                  git add .
                  git commit -m "chore(release): bump root version to ${ROOT_VERSION} [skip ci]" || echo "No changes to commit"
                  git push

    create-draft-release:
        needs: [changes, version-update]
        if: ${{ needs.changes.outputs.has-changes == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - uses: release-drafter/release-drafter@v5
              id: draft
              with:
                  publish: false
                  version: ${{ needs.version-update.outputs.root-version }}
                  tag: ${{ needs.version-update.outputs.root-version }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-and-deploy:
        needs: [changes, version-update]
        if: ${{ needs.changes.outputs.has-changes == 'true' }}
        runs-on: ubuntu-latest
        name: Build and Deploy
        strategy:
            fail-fast: false
            matrix:
                project: ${{ fromJson(needs.changes.outputs.matrix) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.LEMON_BOT_TOKEN }}

            - name: Pull latest changes
              run: git pull origin develop

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              id: cache-dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                      node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
              run: yarn install --frozen-lockfile

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

            - name: Deploy to DEV
              env:
                  BUCKET_NAME: ${{ matrix.project == 'admin' && secrets.ADMIN_BUCKET_NAME || secrets.BUCKET_NAME }}
                  DEV_CF_DISTRIBUTION_ID: ${{ matrix.project == 'admin' && secrets.ADMIN_DEV_CF_DISTRIBUTION_ID || secrets.DEV_CF_DISTRIBUTION_ID }}
                  VITE_ENV: DEV
                  VITE_PROJECT: FLOWS
                  VITE_PROCESS_API: real
                  VITE_API_URL: ${{ secrets.VITE_DEV_API_URL }}
                  VITE_WS_ENDPOINT: ${{ secrets.VITE_DEV_WS_ENDPOINT }}
                  VITE_TOOL_WS_ENDPOINT: ${{ secrets.VITE_DEV_TOOL_WS_ENDPOINT || 'wss://wss.eureka.codes/cht-d1' }}
                  VITE_CODES_URL: ${{ secrets.VITE_DEV_CODES_URL }}
                  VITE_OAUTH_ENDPOINT: ${{ secrets.VITE_DEV_OAUTH_ENDPOINT }}
                  VITE_SOCIAL_OAUTH_ENDPOINT: ${{ secrets.VITE_DEV_SOCIAL_OAUTH_ENDPOINT }}
                  VITE_OPENAPI_ENDPOINT: ${{ secrets.VITE_DEV_OPENAPI_ENDPOINT }}
                  VITE_REGION: ap-northeast-2
                  VITE_HOST: ${{ secrets.VITE_DEV_HOST }}
              run: |
                  set -e
                  chmod +x scripts/deploy.sh scripts/deploy-${{ matrix.project }}.sh
                  NODE_OPTIONS="--max-old-space-size=4096" yarn ${{ matrix.project }}:deploy:dev

    notify-dou:
        needs: [changes, version-update, build-and-deploy]
        if: ${{ success() && needs.changes.outputs.has-changes == 'true' }}
        name: Notify DoU
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Prepare deploy message
              id: deploy-message
              run: |
                  set -e
                  DEPLOY_MESSAGES=()

                  if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *Flows* <https://flow-dev.eureka.codes/|개발 서버> \`v${{ needs.version-update.outputs.web-version }}\`")
                  fi

                  if [[ "${{ needs.changes.outputs.admin }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *Admin* <https://flow-admin-dev.eureka.codes/|개발 서버> \`v${{ needs.version-update.outputs.admin-version }}\`")
                  fi

                  if [ ${#DEPLOY_MESSAGES[@]} -eq 0 ]; then
                      DEPLOY_INFO="*개발 환경 배포가 완료되었습니다.*"
                  else
                      DEPLOY_INFO=$(printf "%s\n" "${DEPLOY_MESSAGES[@]}")
                  fi

                  {
                    echo "deploy_info<<EOF"
                    echo -e "$DEPLOY_INFO"
                    echo "EOF"
                  } >> $GITHUB_OUTPUT || {
                    echo "deploy_info=⚠️ 배포 메시지 생성 실패" >> $GITHUB_OUTPUT
                  }

            - name: Notify DoU
              uses: lemoncloud-io/actions/notify-dou@v1
              with:
                  url: ${{ secrets.DOU_WEBHOOK_URL }}
                  token: ${{ secrets.DOU_WEBHOOK_TOKEN }}
                  channel-id: ${{ secrets.DOU_CHANNEL_ID }}
                  status: success
                  stage: dev
                  text: ${{ steps.deploy-message.outputs.deploy_info }}

    notify-dou-failure:
        needs: [changes, version-update, create-draft-release, build-and-deploy]
        if: ${{ failure() && needs.changes.outputs.has-changes == 'true' }}
        name: Notify DoU - Failure
        runs-on: ubuntu-latest

        steps:
            - name: Prepare deploy message
              id: deploy-message
              run: |
                  set -e
                  DEPLOY_MESSAGES=()

                  if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *Flows* <https://flow-dev.eureka.codes/|개발 서버>")
                  fi

                  if [[ "${{ needs.changes.outputs.admin }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *Admin* <https://flow-admin-dev.eureka.codes/|개발 서버>")
                  fi

                  if [ ${#DEPLOY_MESSAGES[@]} -eq 0 ]; then
                      DEPLOY_INFO="*개발 환경 배포 중 오류가 발생했습니다.*"
                  else
                      DEPLOY_INFO=$(printf "*배포 실패:*\n%s" "$(printf "%s\n" "${DEPLOY_MESSAGES[@]}")")
                  fi

                  {
                    echo "deploy_info<<EOF"
                    echo -e "$DEPLOY_INFO"
                    echo "EOF"
                  } >> $GITHUB_OUTPUT || {
                    echo "deploy_info=⚠️ 배포 메시지 생성 실패" >> $GITHUB_OUTPUT
                  }

            - name: Notify DoU - failure
              uses: lemoncloud-io/actions/notify-dou@v1
              with:
                  url: ${{ secrets.DOU_WEBHOOK_URL }}
                  token: ${{ secrets.DOU_WEBHOOK_TOKEN }}
                  channel-id: ${{ secrets.DOU_CHANNEL_ID }}
                  status: failure
                  stage: dev
                  text: ${{ steps.deploy-message.outputs.deploy_info }}
