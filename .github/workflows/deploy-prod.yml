name: deploy-prod
on:
    push:
        branches:
            - main

jobs:
    changes:
        name: Check changed projects
        runs-on: ubuntu-latest
        outputs:
            web: ${{ steps.set-matrix.outputs.web }}
            admin: ${{ steps.set-matrix.outputs.admin }}
            matrix: ${{ steps.set-matrix.outputs.matrix }}
            has-changes: ${{ steps.set-matrix.outputs.has-changes }}

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - uses: dorny/paths-filter@v2
              id: filter
              with:
                  base: 'main'
                  filters: |
                      web:
                          - 'apps/web/src/**'
                          - 'apps/web/public/**'
                          - 'apps/web/index.html'
                          - 'apps/web/vite.config.mts'
                          - 'apps/web/project.json'
                          - 'apps/web/tsconfig*.json'
                          - 'apps/web/tailwind.config.js'
                          - 'apps/web/postcss.config.cjs'
                          - 'apps/web/.env.*'
                          - 'libs/**'
                          - 'package.json'
                          - 'yarn.lock'
                      admin:
                          - 'apps/admin/src/**'
                          - 'apps/admin/public/**'
                          - 'apps/admin/index.html'
                          - 'apps/admin/vite.config.mts'
                          - 'apps/admin/tsconfig*.json'
                          - 'apps/admin/tailwind.config.cjs'
                          - 'apps/admin/postcss.config.cjs'
                          - 'apps/admin/.env.*'
                          - 'libs/**'
                          - 'package.json'
                          - 'yarn.lock'

            - name: Set matrix for changed projects
              id: set-matrix
              run: |
                  PROJECTS=()
                  WEB_CHANGED="false"
                  ADMIN_CHANGED="false"

                  if [[ "${{ steps.filter.outputs.web }}" == "true" && -d "apps/web" ]]; then
                      PROJECTS+=('"web"')
                      WEB_CHANGED="true"
                  fi

                  if [[ "${{ steps.filter.outputs.admin }}" == "true" && -d "apps/admin" ]]; then
                      PROJECTS+=('"admin"')
                      ADMIN_CHANGED="true"
                  fi

                  if [ ${#PROJECTS[@]} -eq 0 ]; then
                      echo "matrix=[]" >> $GITHUB_OUTPUT
                      echo "has-changes=false" >> $GITHUB_OUTPUT
                  else
                      MATRIX="[$(IFS=,; echo "${PROJECTS[*]}")]"
                      echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
                      echo "has-changes=true" >> $GITHUB_OUTPUT
                  fi

                  echo "web=${WEB_CHANGED}" >> $GITHUB_OUTPUT
                  echo "admin=${ADMIN_CHANGED}" >> $GITHUB_OUTPUT

    get-version:
        needs: changes
        if: ${{ needs.changes.outputs.has-changes == 'true' }}
        name: Get Versions
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            root-version: ${{ steps.get-root-version.outputs.root-version }}
            web-version: ${{ steps.get-web-version.outputs.web-version }}
            admin-version: ${{ steps.get-admin-version.outputs.admin-version }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.LEMON_BOT_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Root Version
              id: get-root-version
              run: |
                  ROOT_VERSION=$(node -p "require('./package.json').version")
                  if ! echo "$ROOT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "Error: Invalid root version format: $ROOT_VERSION"
                    exit 1
                  fi
                  echo "root-version=${ROOT_VERSION}" >> $GITHUB_OUTPUT

            - name: Get Web Version
              if: ${{ needs.changes.outputs.web == 'true' }}
              id: get-web-version
              run: |
                  if [[ -f "apps/web/package.json" ]]; then
                      WEB_VERSION=$(node -p "require('./apps/web/package.json').version")
                      if ! echo "$WEB_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                        echo "Error: Invalid web version format: $WEB_VERSION"
                        exit 1
                      fi
                      echo "web-version=${WEB_VERSION}" >> $GITHUB_OUTPUT
                  fi

            - name: Get Admin Version
              if: ${{ needs.changes.outputs.admin == 'true' }}
              id: get-admin-version
              run: |
                  if [[ -f "apps/admin/package.json" ]]; then
                      ADMIN_VERSION=$(node -p "require('./apps/admin/package.json').version")
                      if ! echo "$ADMIN_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                        echo "Error: Invalid admin version format: $ADMIN_VERSION"
                        exit 1
                      fi
                      echo "admin-version=${ADMIN_VERSION}" >> $GITHUB_OUTPUT
                  fi

    build-and-deploy:
        needs: [changes, get-version]
        if: ${{ needs.changes.outputs.has-changes == 'true' }}
        runs-on: ubuntu-latest
        name: Build and Deploy
        strategy:
            fail-fast: false
            matrix:
                project: ${{ fromJson(needs.changes.outputs.matrix) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.LEMON_BOT_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              id: cache-dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                      node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
              run: yarn install --frozen-lockfile

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

            - name: Deploy to PROD
              env:
                  BUCKET_NAME: ${{ matrix.project == 'admin' && secrets.ADMIN_BUCKET_NAME || secrets.BUCKET_NAME }}
                  PROD_CF_DISTRIBUTION_ID: ${{ matrix.project == 'admin' && secrets.ADMIN_PROD_CF_DISTRIBUTION_ID || secrets.PROD_CF_DISTRIBUTION_ID }}
                  VITE_ENV: PROD
                  VITE_PROJECT: FLOWS
                  VITE_PROCESS_API: real
                  VITE_API_URL: ${{ secrets.VITE_PROD_API_URL }}
                  VITE_WS_ENDPOINT: ${{ secrets.VITE_PROD_WS_ENDPOINT }}
                  VITE_TOOL_WS_ENDPOINT: ${{ secrets.VITE_PROD_TOOL_WS_ENDPOINT || 'wss://wss.eureka.codes/cht-v1' }}
                  VITE_CODES_URL: ${{ secrets.VITE_PROD_CODES_URL }}
                  VITE_OAUTH_ENDPOINT: ${{ secrets.VITE_PROD_OAUTH_ENDPOINT }}
                  VITE_SOCIAL_OAUTH_ENDPOINT: ${{ secrets.VITE_PROD_SOCIAL_OAUTH_ENDPOINT }}
                  VITE_OPENAPI_ENDPOINT: ${{ secrets.VITE_PROD_OPENAPI_ENDPOINT }}
                  VITE_REGION: ap-northeast-2
                  VITE_HOST: ${{ secrets.VITE_PROD_HOST }}
              run: |
                  set -e
                  chmod +x scripts/deploy.sh scripts/deploy-${{ matrix.project }}.sh
                  NODE_OPTIONS="--max-old-space-size=4096" yarn ${{ matrix.project }}:deploy:prod

    notify-dou:
        needs: [changes, get-version, build-and-deploy]
        if: ${{ success() && needs.changes.outputs.has-changes == 'true' }}
        name: Notify DoU
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - uses: release-drafter/release-drafter@v5
              id: release-drafted
              with:
                  publish: true
                  version: ${{ needs.get-version.outputs.root-version }}
                  tag: ${{ needs.get-version.outputs.root-version }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare deploy message
              id: deploy-message
              run: |
                  set -e
                  DEPLOY_MESSAGES=()

                  if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *Flows* <https://flow.eureka.codes/|운영 서버> \`v${{ needs.get-version.outputs.web-version }}\`")
                  fi

                  if [[ "${{ needs.changes.outputs.admin }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *Admin* <https://flow-admin.eureka.codes/|운영 서버> \`v${{ needs.get-version.outputs.admin-version }}\`")
                  fi

                  if [ ${#DEPLOY_MESSAGES[@]} -eq 0 ]; then
                      DEPLOY_INFO="*운영 환경 배포가 완료되었습니다.*"
                  else
                      DEPLOY_INFO=$(printf "%s\n" "${DEPLOY_MESSAGES[@]}")
                  fi

                  {
                    echo "deploy_info<<EOF"
                    echo -e "$DEPLOY_INFO"
                    echo "EOF"
                  } >> $GITHUB_OUTPUT || {
                    echo "deploy_info=⚠️ 배포 메시지 생성 실패" >> $GITHUB_OUTPUT
                  }

            - name: Notify DoU
              uses: lemoncloud-io/actions/notify-dou@v1
              with:
                  url: ${{ secrets.DOU_WEBHOOK_URL }}
                  token: ${{ secrets.DOU_WEBHOOK_TOKEN }}
                  channel-id: ${{ secrets.DOU_CHANNEL_ID }}
                  status: success
                  stage: prod
                  text: ${{ steps.deploy-message.outputs.deploy_info }}
                  release-notes: ${{ steps.release-drafted.outputs.body }}

    notify-dou-failure:
        needs: [changes, get-version, build-and-deploy]
        if: ${{ failure() && needs.changes.outputs.has-changes == 'true' }}
        name: Notify DoU - Failure
        runs-on: ubuntu-latest

        steps:
            - name: Prepare deploy message
              id: deploy-message
              run: |
                  set -e
                  DEPLOY_MESSAGES=()

                  if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *Flows* <https://flow.eureka.codes/|운영 서버>")
                  fi

                  if [[ "${{ needs.changes.outputs.admin }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *Admin* <https://flow-admin.eureka.codes/|운영 서버>")
                  fi

                  if [ ${#DEPLOY_MESSAGES[@]} -eq 0 ]; then
                      DEPLOY_INFO="*운영 환경 배포 중 오류가 발생했습니다.*"
                  else
                      DEPLOY_INFO=$(printf "*배포 실패:*\n%s" "$(printf "%s\n" "${DEPLOY_MESSAGES[@]}")")
                  fi

                  {
                    echo "deploy_info<<EOF"
                    echo -e "$DEPLOY_INFO"
                    echo "EOF"
                  } >> $GITHUB_OUTPUT || {
                    echo "deploy_info=⚠️ 배포 메시지 생성 실패" >> $GITHUB_OUTPUT
                  }

            - name: Notify DoU - failure
              uses: lemoncloud-io/actions/notify-dou@v1
              with:
                  url: ${{ secrets.DOU_WEBHOOK_URL }}
                  token: ${{ secrets.DOU_WEBHOOK_TOKEN }}
                  channel-id: ${{ secrets.DOU_CHANNEL_ID }}
                  status: failure
                  stage: prod
                  text: ${{ steps.deploy-message.outputs.deploy_info }}
